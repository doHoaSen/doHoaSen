name: Update Contribution Slip

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/generate-streak-stub.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          if ! git diff --quiet -- assets/streak-stub.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/streak-stub.svg
            git commit -m "[$(date +%y%m%d)] Contribution Slip 자동 갱신"
            git push
          else
            echo "변경 없음, 커밋 생략"
          fi
